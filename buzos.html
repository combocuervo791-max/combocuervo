<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Buzos</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
color:#222;
}

.contenedor{
width:90%;
max-width:1000px;
margin:auto;
padding:40px 0;
}

.galeria{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-bottom:40px;
}

.galeria img{
width:100%;
border-radius:20px;
object-fit:cover;
}

.info{
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
text-align:center;
}

h1{
font-size:40px;
margin-bottom:20px;
}

.precio{
font-size:36px;
color:#0a84ff;
font-weight:bold;
margin-bottom:20px;
}

.descripcion{
font-size:18px;
margin-bottom:30px;
line-height:1.6;
}

.boton{
display:inline-block;
background:#25d366;
color:white;
text-decoration:none;
padding:16px 28px;
border-radius:12px;
font-size:20px;
transition:0.2s;
}

.boton:hover{
transform:scale(1.05);
background:#1ebe5d;
}

</style>
</head>

<body>

<div class="contenedor">

<div class="galeria">

<img src="buzocapuchaarg.jpg">

<img src="buzodarlinmedio-irl.jpg">
<img src="buzodarlinmedio-nz.jpg">
<img src="buzodarlinmedio-nzgris.jpg">
<img src="buzotalle.jpg">

</div>

<div class="info">

<h1>Buzos</h1>

<div class="precio">$50.000</div>

<div class="descripcion">

Disponible en varios talles y colores.

</div>

class="boton"
href="https://wa.me/542920214841?text=Hola!%20Quiero%20consultar%20por%20los%20buzos"
