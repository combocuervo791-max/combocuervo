<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tienda de Ropa</title>

  <style>
/* VISOR */

.visor{
  display:none;
  position:fixed;
  z-index:999;
  left:0;
  top:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.9);
  justify-content:center;
  align-items:center;
}

.visor img{
  max-width:90%;
  max-height:90%;
  border-radius:20px;
}

.cerrar{
  position:absolute;
  top:20px;
  right:30px;
  color:white;
  font-size:45px;
  cursor:pointer;
}

/* EFECTO EN IMAGEN */

.producto img{
  cursor:pointer;
}
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f5f5f5;
      color:#222;
    }

    /* ENCABEZADO */

    header{
      background:black;
      color:white;
      text-align:center;
      padding:40px 20px;
    }

    header h1{
      font-size:40px;
      margin-bottom:10px;
    }

    header p{
      font-size:18px;
      opacity:0.8;
    }

    /* CONTENEDOR */

    .contenedor{
      width:90%;
      max-width:1200px;
      margin:auto;
      padding:40px 0;
    }

    /* PRODUCTOS */

    .productos{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
      gap:25px;
    }

    .producto{
      background:white;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
      transition:0.2s;
    }

    .producto:hover{
      transform:scale(1.02);
    }

    .producto img{
      width:100%;
      height:320px;
      object-fit:cover;
    }

    .info{
      padding:20px;
      text-align:center;
    }

    .info h2{
      font-size:24px;
      margin-bottom:10px;
    }

    .precio{
      font-size:30px;
      color:#0a84ff;
      font-weight:bold;
      margin-bottom:20px;
    }

    .boton{
      display:inline-block;
      background:#25d366;
      color:white;
      text-decoration:none;
      padding:14px 22px;
      border-radius:12px;
      font-size:18px;
      transition:0.2s;
    }

    .boton:hover{
      transform:scale(1.05);
    }

  </style>
</head>

<body>

  <!-- ENCABEZADO -->

  <header>
    <h1>JUNIO</h1>
    <p>Ropa deportiva y urbana</p>
  </header>

  <!-- PRODUCTOS -->

  <div class="contenedor">

    <div class="productos">

      <!-- PRODUCTO 1 -->

      <div class="producto">

        <img src="camargentina.jpeg" alt="Remera">

        <div class="info">

         <a 
class="boton"
href="camisetas.html">

Ver más

</a>

        </div>

      </div>

      <!-- PRODUCTO 2 -->

      <div class="producto">

        <img src="s1.jpg" alt="Buzo">

        <div class="info">

        <a 
class="boton"
href="short.html">

Ver más

</a>

        </div>

      </div>

      <!-- PRODUCTO 3 -->

      <div class="producto">

        <img src="scb1.jpg" alt="Campera">

        <div class="info">

          <h2>short con bolsillos</h2>

          <div class="precio">$35.000</div>

        <a 
class="boton"
href="shortcb.html">

Ver más

</a>
            </div>

      </div>

<!-- PRODUCTO 4 -->

<div class="producto">

  <img src="buzocapuchanz.jpg" alt="Pantalón">

  <div class="info">

    <h2>BUZOS</h2>

    Ver más

</div>

<!-- PRODUCTO 5 -->

<!-- PRODUCTO 6 -->

<div class="producto">

  </div>
<!-- VISOR DE IMAGEN -->

<div id="visor" class="visor">

  <span class="cerrar">&times;</span>

  <img id="imgGrande">

</div>
  <script>

const visor = document.getElementById("visor");
const imgGrande = document.getElementById("imgGrande");

document.querySelectorAll(".producto img").forEach(img => {

  img.addEventListener("click", () => {

    visor.style.display = "flex";

    imgGrande.src = img.src;

  });

});

document.querySelector(".cerrar").addEventListener("click", () => {

  visor.style.display = "none";

});

visor.addEventListener("click", (e) => {

  if(e.target === visor){

    visor.style.display = "none";

  }

});

</script>
</body>
</html>
