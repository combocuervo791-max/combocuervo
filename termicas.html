<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ROPA TERMICA</title>

<style>
/* VISOR */

.visor{
  display:none;
  position:fixed;
  z-index:999;
  left:0;
  top:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.9);
  justify-content:center;
  align-items:center;
}

.visor img{
  max-width:90%;
  max-height:90%;
  border-radius:20px;
}

.cerrar{
  position:absolute;
  top:20px;
  right:30px;
  color:white;
  font-size:45px;
  cursor:pointer;
}

/* EFECTO EN IMAGEN */

.producto img{
  cursor:pointer;
}
  
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f5f5f5;
color:#222;
}

.contenedor{
width:90%;
max-width:1000px;
margin:auto;
padding:40px 0;
}

.galeria{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-bottom:40px;
}

.galeria img{
width:100%;
border-radius:20px;
object-fit:cover;
}

.info{
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
text-align:center;
}

h1{
font-size:40px;
margin-bottom:20px;
}

.precio{
font-size:36px;
color:#0a84ff;
font-weight:bold;
margin-bottom:20px;
}

.descripcion{
font-size:18px;
margin-bottom:30px;
line-height:1.6;
}

.boton{
display:inline-block;
background:#25d366;
color:white;
text-decoration:none;
padding:16px 28px;
border-radius:12px;
font-size:20px;
transition:0.2s;
}

.boton:hover{
transform:scale(1.05);
background:#1ebe5d;
}

</style>
</head>

<body>

<div class="contenedor">

<div class="galeria">

<img src="terminca1.jpeg">
  <img src="terminca2.jpg">
  <img src="terminca3.jpg">
  <img src="terminca4.jpg">
  <img src="terminca5.jpg">
  <img src="terminca6.jpg">
  <img src="talleropatermica.jpg">
  <img src="calzacorta1.jpg">
  <img src="calzacorta2.jpg">
  <img src="calzacorta3.jpeg">
  <img src="calzacorta4.jpg">
  <img src="calzacorta5.jpg">
  <img src="calzalarga1.jpg">
  <img src="calzalarga2.jpg">
  <img src="calzalarga3.jpg">
  <img src="calzalarga 4.jpg">
  
  
</div>

<div class="info">

<h1>REMERAS TERMICA Y CALZAS LARGAS</h1>

<div class="precio">$25.000</div>

<div class="descripcion">
Disponible en varios talles color blanco y negro

</div>
  <div class="info">

<h1>CALZA CORTA</h1>

<div class="precio">$20.000</div>

<div class="descripcion">

Disponible en varios talles color blanco y negro

</div>

<a 
class="boton"
href="https://wa.me/542920516993?text=Hola!%20Quiero%20consultar%20por%20la%20ropa%20termica"
target="_blank">

Consultar por WhatsApp

</a>

</div>

</div>
<!-- VISOR DE IMAGEN -->

<div id="visor" class="visor">

  <span class="cerrar">&times;</span>

  <img id="imgGrande">

</div>
  <script>

const visor = document.getElementById("visor");
const imgGrande = document.getElementById("imgGrande");

document.querySelectorAll(".producto img").forEach(img => {

  img.addEventListener("click", () => {

    visor.style.display = "flex";

    imgGrande.src = img.src;

  });

});

document.querySelector(".cerrar").addEventListener("click", () => {

  visor.style.display = "none";

});

visor.addEventListener("click", (e) => {

  if(e.target === visor){

    visor.style.display = "none";

  }

});

</script>
</body>
</html>
